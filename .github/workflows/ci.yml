name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: backend/projeto-qa
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/PI-Gerenciador-de-Biblioteca-Pessoal/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm install

      - name: Build Frontend
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm test -- --watch=false

name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Diagnostic - Backend Files
        working-directory: backend/projeto-qa
        run: ls -la

      - name: Build and Test Backend
        working-directory: backend/projeto-qa
        env:
          SPRING_DATA_MONGODB_HOST: localhost
          SPRING_DATA_MONGODB_PORT: 27017
        run: |
          tr -d '\r' < mvnw > mvnw_unix
          mv mvnw_unix mvnw
          chmod +x mvnw
          ./mvnw clean test

  frontend-test:
    name: Frontend CI
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/PI-Gerenciador-de-Biblioteca-Pessoal/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm test -- --watch=false
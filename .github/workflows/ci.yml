name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MONGODB_URI: mongodb://localhost:27017/biblioteca_pessoal_test

# ─────────────────────────────────────────
# BACKEND JOBS (seguindo o modelo do professor)
# ─────────────────────────────────────────

jobs:
  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/projeto-qa

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw -B -ntp clean package -DskipTests

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: backend/projeto-qa

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and integration tests
        run: ./mvnw -B -ntp clean test
        env:
          SPRING_DATA_MONGODB_URI: ${{ env.MONGODB_URI }}

  backend-coverage:
    name: Backend - Coverage (JaCoCo)
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend/projeto-qa

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run full verification with coverage and SonarCloud
        run: ./mvnw -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Alex-sampaio-lima_Projeto-Q.A -Dsonar.organization=alex-sampaio-lima -Dsonar.host.url=https://sonarcloud.io
        env:
          SPRING_DATA_MONGODB_URI: ${{ env.MONGODB_URI }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/projeto-qa/target/site/jacoco/

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/projeto-qa/target/surefire-reports/

      - name: Upload packaged jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/projeto-qa/target/*.jar

# ─────────────────────────────────────────
# FRONTEND JOB
# ─────────────────────────────────────────

  frontend-test:
    name: Frontend - Test (Vitest)
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/PI-Gerenciador-de-Biblioteca-Pessoal/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm install --no-audit --no-fund

      - name: Build Frontend
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend/PI-Gerenciador-de-Biblioteca-Pessoal
        run: npm test -- --watch=false